name: 🚀 Deploy to Production (Manual)
# NOTE: StackCP handles auto-deployment via its built-in Git integration.
# This workflow is kept as a manual backup only.
on:
  workflow_dispatch:  # Only runs when manually triggered from GitHub Actions UI

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout the code ────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── 2. SSH into server and run deploy.sh ────────────────
      - name: 🔐 Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/public_html/meher
            bash deploy.sh

      # ── 3. Notify on success ────────────────────────────────
      - name: ✅ Deployment complete
        run: echo "Deployed successfully to https://meher.logimint.xyz"
